<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2eb">
  <meta name="description" content="PocketDex: a quiet Pokedex companion. All 1025 Pokemon, a 3D meadow where your catches wander, focus sessions that catch Pokemon, habit training and a photo Field Dex.">
  <title>PocketDex</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PocketDex">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/today" aria-label="PocketDex home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">PocketDex</span>
    </a>
    <div class="hdr-progress" title="Pokemon caught">
      <span class="hdr-track" aria-hidden="true"><span id="hdr-bar"></span></span>
      <span class="hdr-label">Caught</span><b id="hdr-caught">0 / 1025</b>
    </div>
    <button class="icon-toggle" id="sound-toggle" type="button" aria-pressed="true" data-silent aria-label="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <span id="sound-label">Sound on</span>
    </button>
  </header>

  <main id="view" class="view" tabindex="-1">
    <noscript><p>PocketDex needs JavaScript turned on.</p></noscript>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-route="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>
      <span>Today</span>
    </a>
    <a href="#/dex" data-route="dex">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5A2.5 2.5 0 0 1 18 7v12.5H7.5A2.5 2.5 0 0 1 5 17z"/><path d="M5 17a2.5 2.5 0 0 1 2.5-2.5H18M9 8.5h5"/></svg>
      <span>Pokédex</span>
    </a>
    <a href="#/focus" data-route="focus">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9.5V13l2.5 1.5M10 3.5h4"/></svg>
      <span>Focus</span>
    </a>
    <a href="#/habits" data-route="habits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      <span>Habits</span>
    </a>
    <a href="#/more" data-route="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="17.5" cy="12" r="1.4"/></svg>
      <span>More</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <script src="data.js"></script>
  <script src="meadow.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  </script>
</body>
</html>
